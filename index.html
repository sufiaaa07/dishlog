<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dishlog">
<meta name="format-detection" content="telephone=no">
<title>Dishlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--ink:#15110F;--paper:#F7F3EC;--bg:#0E0C0B;--bg2:#1C1917;--lime:#C8F23A;--yellow:#FFD84D;--green:#2BCB6B;--blue:#3D6BFF;--pink:#FF8DC7;--orange:#FF6B2C;--red:#FF4B4B;--accent:#FF5A36;--leaf:#1FA855;--saff:#FFC53D;--sky:#3D6BFF;--r:28px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:#F6F2EC;display:flex;justify-content:center;align-items:center;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
/* contexts */
.phone{--fg:#F6F2EC;--ink2:#A39B92;--ink3:#6B645D;--line:rgba(255,255,255,.12);--soft:rgba(255,255,255,.08);--fieldbg:#1C1917;--chipbd:rgba(255,255,255,.24);--segbg:#1C1917;--invbg:#fff;--invfg:#15110F;--danger:#FF6B5B;--pillbg:rgba(255,255,255,.1);--pillfg:#E9E4DC;color:var(--fg)}
.card,.box,.li,.post,.modal,.sug,.lock,.banner,.statg>div,.picked,.toast,.tlc,.feat-card{--fg:#15110F;--ink2:#776E66;--ink3:#ADA399;--line:#E4DCCF;--soft:#EEE8DE;--fieldbg:#fff;--chipbd:#D8CFC2;--segbg:#ECE5DA;--invbg:#15110F;--invfg:#fff;--danger:#C62A1F;--pillbg:#ECE5DA;--pillfg:#5A524B;color:var(--fg)}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
.island,.sbar{display:none}
@media(min-width:900px) and (min-height:640px) and (hover:hover) and (pointer:fine){
 body{background:radial-gradient(circle at 15% 20%,#FFE53B 0,transparent 40%),radial-gradient(circle at 85% 80%,#1FA855 0,transparent 45%),linear-gradient(135deg,#F2E21B,#A6D51E 50%,#22B45A)}
 .phone{width:390px;height:min(844px,calc(100vh - 48px));border-radius:56px;box-shadow:0 0 0 11px #0A0A0A,0 0 0 13px #3B3B3B,0 40px 90px rgba(0,0,0,.45);--sat:46px;--sab:12px}
 .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:200}
 .sbar{display:flex;justify-content:space-between;position:absolute;top:0;left:0;right:0;height:46px;padding:16px 32px 0 36px;font-weight:600;font-size:15px;z-index:199;pointer-events:none;color:#fff}
}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;padding:calc(8px + var(--sat)) 16px 120px;scrollbar-width:none}
.main::-webkit-scrollbar,.ovb::-webkit-scrollbar{display:none}
h1,h2,.serif,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.03em}
h1{font-size:30px;line-height:1}
h1.big{font-size:46px;line-height:.92;margin:6px 0 14px}
h2{font-size:21px;line-height:1.1}
.px{font-family:Silkscreen,monospace;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-family:Silkscreen,monospace;font-size:11px;color:var(--lime);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:11.5px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 8px}
.mark{width:44px;height:44px;flex:none}
.tpill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:14px}
.tpill .ic{width:26px;height:26px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.tpill svg{width:15px;height:15px}
.icon{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);flex:none;color:var(--fg)}
.icon svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;background:var(--segbg);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--fg);text-align:center;opacity:.85;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:#fff;color:#15110F;opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.seg button svg{width:14px;height:14px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:transparent;border:1.5px solid var(--chipbd);color:var(--fg);font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--invbg);color:var(--invfg);border-color:var(--invbg)}
.chip.sm{padding:5px 10px;font-size:12.5px}
.chip .n{opacity:.55;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pillbg);color:var(--pillfg)}
.pill svg{width:12px;height:12px}
.pill.red{background:#FFD9E9;color:#C2185B}.pill.amb{background:#FFF0B8;color:#8A5A00}.pill.grn{background:#DDF7B0;color:#2F6B00}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--fg);font-size:14.5px;transition:transform .1s}
.btn:active,.chip:active,.rx:active,.nav button:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#E0FF6A,#B4E52A 60%,#9CD414);color:#15110F;border:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(0,0,0,.12),0 8px 20px rgba(170,230,40,.28)}
.btn.dark{background:var(--invbg);border-color:var(--invbg);color:var(--invfg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.full{width:100%}.btn.sm{padding:8px 13px;font-size:13px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;width:100%;background:var(--paper);border-radius:var(--r);overflow:hidden;padding:7px;position:relative}
.cover{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden}
.cover>.ph,.cover>img{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;background:rgba(255,255,255,.95);color:#15110F;border-radius:999px;font-size:12px;font-weight:700;padding:3px 8px;display:flex;align-items:center;gap:3px;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badge svg{width:11px;height:11px}
.tl{top:9px;left:9px}.tr{top:9px;right:9px;font-size:16px;padding:3px 6px}.bl{bottom:9px;left:9px}
.stk{position:absolute;z-index:2;font-family:Silkscreen,monospace;font-size:11px;line-height:1.1;text-transform:uppercase;padding:5px 8px;border-radius:9px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.stk.bub{background:#FF4B4B;color:#fff;transform:rotate(-8deg);border-radius:10px}
.stk.bub::after{content:'';position:absolute;left:12px;bottom:-6px;border:6px solid transparent;border-top-color:#FF4B4B;border-bottom:0}
.stk.blk{background:#15110F;color:#fff;transform:rotate(5deg);border:2px solid #fff}
.stk.lime{background:var(--lime);color:#15110F;transform:rotate(-4deg)}
.cbody{padding:10px 7px 5px}
.cname{font-weight:700;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.csub{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{color:#FF3D7F}
img.ph{object-fit:cover;display:block}
.ph{position:relative;background:radial-gradient(120% 95% at 22% 12%,hsl(var(--h) 100% 80%),hsl(var(--h) 88% 62%) 55%,hsl(var(--h) 75% 50%));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph::before{content:'';position:absolute;left:14%;right:14%;top:44%;height:38%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#fff,hsl(var(--h) 60% 92%) 60%,hsl(var(--h) 45% 82%));box-shadow:0 7px 0 hsl(var(--h) 55% 38% / .55),0 16px 26px rgba(0,0,0,.25)}
.ph span{position:relative;font-size:var(--fs,64px);transform:translateY(-8%) rotate(-10deg);filter:drop-shadow(0 10px 8px rgba(0,0,0,.28)) saturate(1.15)}
.ph.none{background:repeating-linear-gradient(45deg,#EEE8DE,#EEE8DE 10px,#E6DED1 10px,#E6DED1 20px);flex-direction:column;gap:2px}
.ph.none::before{display:none}.ph.none span{transform:none;opacity:.75;font-size:calc(var(--fs,64px)*.6);filter:grayscale(.2)}
.ph.none small{position:relative;font-size:11px;color:#776E66;font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:24px;padding:9px 12px 9px 9px;width:100%}
.thumb{width:58px;height:58px;border-radius:16px;overflow:hidden;flex:none;--fs:30px}
.thumb>*{width:100%;height:100%}
.li .t{font-weight:700;font-size:14.5px}
.li .s{font-size:12.5px;color:var(--ink2)}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin:24px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2{font-size:22px}
.box{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:12px}
.empty{text-align:center;padding:36px 18px;color:var(--ink2)}
.empty .big{font-size:60px;margin-bottom:10px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
.empty h2{color:var(--fg);margin-bottom:6px;font-size:26px}
/* floating nav */
.nav{position:absolute;left:0;right:0;bottom:calc(12px + var(--sab));display:flex;align-items:center;justify-content:center;gap:10px;z-index:10;pointer-events:none}
.nav::before{content:'';position:absolute;left:0;right:0;bottom:calc(-12px - var(--sab));height:110px;background:linear-gradient(transparent,rgba(14,12,11,.92) 55%);pointer-events:none}
.ng{position:relative;display:flex;gap:4px;padding:6px;border-radius:999px;background:#1C1917;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto}
.ng button{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#CFC8BF;position:relative;background:#2A2623}
.ng button.on{background:var(--lime);color:#15110F}
.fab{position:relative;width:66px;height:66px;border-radius:50%;background:#fff;color:#15110F;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.08);pointer-events:auto}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.dot{position:absolute;top:2px;right:2px;background:#FF4B4B;color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #1C1917}
/* overlays */
.ov{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
.ov.up{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.ovh{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 14px 10px}
.ovh .ttl{flex:1;font-weight:700;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovb{flex:1;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.ovf{padding:12px 16px calc(14px + var(--sab));background:linear-gradient(transparent,var(--bg) 25%)}
.hero{position:relative;aspect-ratio:1/1;border-radius:34px;overflow:hidden;margin-bottom:16px;--fs:150px}
.hero>.ph,.hero>img{position:absolute;inset:0;width:100%;height:100%}
.hero .stk{font-size:14px;padding:8px 12px}
.spotlink{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:600;font-size:14px;text-align:left}
.spotlink svg{width:16px;height:16px;color:var(--accent);flex:none}
.hist{position:relative;padding-left:22px;margin-top:6px}
.hist::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.he{position:relative;margin-bottom:14px}
.he::before{content:'';position:absolute;left:-21px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink3)}
.he.latest::before{border-color:var(--lime);background:var(--lime)}
.strip{display:flex;gap:8px;overflow-x:auto;margin:10px 0;scrollbar-width:none}
.strip .sp{width:100px;height:100px;border-radius:18px;overflow:hidden;flex:none;--fs:44px}
.strip .sp>*{width:100%;height:100%}
.label{font-weight:700;font-size:14px;margin:20px 0 9px;display:flex;justify-content:space-between}
.label .opt{font-weight:500;color:var(--ink3);font-size:12px}
.label .req{color:var(--lime)}
.lt .label .req,.modal .label .req{color:var(--accent)}
.field{width:100%;padding:13px 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--fieldbg);color:var(--fg);outline:none;font-size:15px}
.field::placeholder{color:var(--ink3)}
.field:focus{border-color:var(--lime)}
.modal .field:focus,.box .field:focus{border-color:#15110F}
select.field option{color:#15110F}
textarea.field{resize:none;min-height:80px}
.miss .field,.miss.chips .chip,.miss .rx{border-color:#FF6B6B!important;box-shadow:0 0 0 3px rgba(255,75,75,.25)}
/* squishy reaction tiles */
.rxs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rx{padding:14px 4px 12px;border-radius:24px;text-align:center;font-size:12.5px;font-weight:700;color:#15110F;border:3px solid transparent;box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(0,0,0,.08),inset 0 0 18px rgba(255,255,255,.5);transition:transform .12s}
.rx b{display:block;font-size:34px;margin-bottom:3px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.rx.loved{background:radial-gradient(circle at 50% 30%,#FFE1F0,#FF9CCF 70%)}
.rx.fine{background:radial-gradient(circle at 50% 30%,#FFF4C2,#FFD45A 70%)}
.rx.nope{background:radial-gradient(circle at 50% 30%,#EAF8C6,#A9E35A 70%)}
.rx.on{border-color:#fff;transform:scale(1.04);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 0 0 4px rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.35)}
.rxs:has(.on) .rx:not(.on){opacity:.5}
.ptile{width:88px;height:88px;border-radius:20px;flex:none;overflow:hidden;position:relative;--fs:40px}
.ptile>.ph,.ptile>img{width:100%;height:100%}
.ptile.add{border:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--bg2)}
.ptile.add svg{width:22px;height:22px}
.ptile .x{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center}
.ptile .x svg{width:12px;height:12px}
.ptile.err{background:#3A1714;border:1.5px solid #FF6B5B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#FFB3A8;font-weight:600;text-align:center;gap:4px;padding:4px}
.ptile.load{background:var(--bg2);display:flex;align-items:center;justify-content:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--lime);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sug{border-radius:20px;background:var(--paper);margin-top:8px;overflow:hidden}
.sug button{display:flex;width:100%;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.sug button:last-child{border-bottom:0}
.picked{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:20px;background:var(--paper)}
.warn{background:#FFF0B8;color:#15110F;border-radius:16px;padding:12px;font-size:13.5px;margin-top:10px;--fg:#15110F;--invbg:#15110F;--invfg:#fff;--soft:#fff;--line:#E8D489}
.note{background:var(--soft);border-radius:16px;padding:11px 13px;font-size:12.5px;color:var(--ink2);margin-top:10px;display:flex;gap:8px}
.note svg{width:15px;height:15px;flex:none;margin-top:1px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);width:100%;border-radius:34px 34px 0 0;padding:22px 18px calc(18px + var(--sab));max-height:88%;overflow-y:auto;animation:up .22s ease-out}
.modal h2{margin-bottom:6px;font-size:24px}
.opt-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:#15110F;margin-bottom:8px;width:100%;--ink2:#776E66}
.opt-row.on{border-color:#15110F;box-shadow:0 0 0 2px #15110F inset}
.ob .opt-row{background:#1C1917;color:#F6F2EC;border-color:rgba(255,255,255,.12);--ink2:#A39B92}
.ob .opt-row.on{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime) inset}
.opt-row .oi{width:36px;height:36px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.opt-row .oi svg{width:18px;height:18px}
#toast{position:absolute;left:16px;right:16px;bottom:calc(100px + var(--sab));z-index:60;pointer-events:none;display:flex;justify-content:center}
.toast{background:#fff;padding:12px 16px;border-radius:20px;font-size:13.5px;font-weight:500;box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;gap:12px;align-items:center;pointer-events:auto;animation:up .2s}
.toast button{color:#E8432A;font-weight:800}
.post{background:var(--paper);border-radius:32px;overflow:hidden;margin-bottom:14px;padding:7px}
.post>.ph,.post>img.ph{aspect-ratio:1/1;width:100%;--fs:120px;border-radius:26px}
.ph-h{display:flex;gap:10px;align-items:center;padding:6px 8px 10px}
.av{width:42px;height:42px;border-radius:13px;flex:none;overflow:hidden;display:block;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:104px;height:104px;border-radius:30px;margin:0 auto}
.av.xs{width:30px;height:30px;border-radius:9px}
.pb{padding:12px 10px 8px}
.pa{display:flex;gap:8px;margin-top:12px;align-items:center}
.liked{color:#FF3D7F}
.liked svg{fill:#FF3D7F}
.map{position:relative;aspect-ratio:1/1.08;border-radius:32px;overflow:hidden;background:#F1E7D8}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin b{min-width:30px;height:30px;border-radius:15px;background:#FF4B4B;color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:0 8px;border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 -3px 0 rgba(0,0,0,.15)}
.pin i{width:3px;height:9px;background:#fff}
.pin.saved b{background:var(--yellow);color:#15110F}
.pin.sel b{transform:scale(1.25);background:#15110F;color:#fff}
.me{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--sky);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 9px rgba(61,107,255,.25)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:12px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg1,.lg2{width:12px;height:12px;border-radius:50%;background:#FF4B4B;display:inline-block}
.lg2{background:var(--yellow)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1.5/1;gap:3px;--fs:34px;border-radius:22px;overflow:hidden}
.mosaic>*{width:100%;height:100%;overflow:hidden}
.mosaic>* >*{width:100%;height:100%}
.statg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.statg>div{border-radius:22px;padding:12px 4px;text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.08)}
.statg>div:nth-child(1){background:var(--lime)}.statg>div:nth-child(2){background:var(--pink)}.statg>div:nth-child(3){background:var(--yellow)}.statg>div:nth-child(4){background:#9DB8FF}
.statg b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;line-height:1.1}
.statg span{font-size:11.5px;font-weight:600;color:#3A332E}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.setrow:last-child{border-bottom:0}
.tog{width:48px;height:28px;border-radius:14px;background:#D8CFC2;position:relative;flex:none;transition:.2s}
.ob .tog{background:#3A3532}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:var(--green)}.tog.on::after{left:23px}
.lock{text-align:center;padding:30px 20px;background:var(--paper);border-radius:28px;margin-top:14px}
.lock svg{width:30px;height:30px;color:var(--ink2);margin-bottom:6px}
.banner{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:24px;padding:10px 12px;margin-bottom:12px}
pre.json{background:#1C1917;color:#D9F57A;font-size:11px;padding:14px;border-radius:20px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.metric{display:flex;gap:10px;align-items:center;background:var(--lime);border-radius:22px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#15110F;font-weight:600}
.metric b{font-family:'Bricolage Grotesque',sans-serif;font-size:24px}
/* feature card (ToyCAD "Get started") */
.feat-card{position:relative;display:block;width:100%;background:var(--paper);border-radius:34px;padding:22px 20px 20px;margin-bottom:14px;overflow:hidden;min-height:190px;text-align:left}
.feat-card h2{font-size:34px;line-height:.95;max-width:62%}
.feat-card p{font-size:13px;color:var(--ink2);margin-top:8px;max-width:58%}
.feat-card .go{margin-top:16px;width:52px;height:52px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.12)}
.feat-card .go svg{width:22px;height:22px}
.feat-card .food{position:absolute;right:-6px;bottom:-10px;font-size:118px;transform:rotate(-14deg);filter:drop-shadow(0 16px 14px rgba(0,0,0,.3))}
.feat-card .food2{position:absolute;right:92px;top:16px;font-size:44px;transform:rotate(18deg);filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
/* timeline cards */
.tlc{position:relative;display:flex;align-items:stretch;width:100%;background:var(--paper);border-radius:32px;min-height:124px;margin-bottom:10px;text-align:left;padding:0}
.tlc .tt{width:124px;flex:none;border-radius:30px;overflow:hidden;--fs:56px;transform:rotate(-3deg) scale(1.04);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.tlc.rev{flex-direction:row-reverse}.tlc.rev .tt{transform:rotate(3deg) scale(1.04)}
.tlc .tt>*{width:100%;height:100%}
.tlc .tx{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column}
.tlc .tx .n{font-weight:700;font-size:16px;line-height:1.2}
.tlc .tx .m{margin-top:auto;font-size:12px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* splash + onboarding */
.splash,.ob{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#2B0808 0,#150303 62%,#0D0101);overflow:hidden}
.splash{z-index:300;display:flex;align-items:center;justify-content:center;transition:opacity .45s}
.splash.out{opacity:0;pointer-events:none}
.flo{position:absolute;font-size:var(--s);transform:rotate(var(--r));animation:bob var(--t,4.5s) ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 14px 14px rgba(0,0,0,.55)) saturate(1.25) contrast(1.05);z-index:0;line-height:1}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(calc(var(--r) + 8deg))}}
.spk{position:absolute;color:#fff;font-size:var(--s,16px);animation:tw 2.4s ease-in-out infinite;animation-delay:var(--d);text-shadow:0 0 8px #fff;z-index:1}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wm{position:relative;z-index:2;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:68px;letter-spacing:-.05em;line-height:1;background:linear-gradient(180deg,#B5CAFF 10%,#8FA9FF 42%,#3BD67A 78%,#22B85E);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.loadbar{position:absolute;left:44px;right:44px;bottom:calc(56px + var(--sab));height:13px;border-radius:7px;background:#C9C3C0;overflow:hidden;z-index:2}
.loadbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#8DB4FF,#A99CFF 45%,#2ECF6E);animation:load 2.1s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes load{to{width:100%}}
.ob{display:flex;flex-direction:column;padding:calc(24px + var(--sat)) 22px calc(22px + var(--sab));overflow-y:auto;z-index:1}
.ob>*{position:relative;z-index:2}
.ob .flo{position:absolute;z-index:0}
.ob h1{font-size:38px;line-height:.95}
.feat{display:flex;gap:12px;align-items:center;margin:10px 0}
.feat .fi{font-size:26px;width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.1)}
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.avpick button{border-radius:14px;padding:2px;border:2.5px solid transparent}
.avpick button.on{border-color:#15110F}
.avpick .av{width:100%;height:auto;aspect-ratio:1}
a{color:inherit}
/* mobile optimisation */
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
.phone{height:100%;height:100dvh}
button,a,input,select,textarea,label{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
.field{font-size:16px}
.main,.ovb{overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
h1.big{font-size:clamp(34px,11vw,46px)}
.stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.stats::-webkit-scrollbar{display:none}
.stats .pill{flex:none}
.chips:not(.wrap){margin-right:-16px;padding-right:16px}
.ng button,.fab,.icon,.btn,.chip,.rx{min-height:40px}
.chip.sm,.btn.sm{min-height:34px}
@media (max-width:380px){
 .main{padding-left:14px;padding-right:14px}.ovb{padding-left:14px;padding-right:14px}
 .ng button{width:44px;height:44px}.fab{width:58px;height:58px}.nav{gap:8px}
 .feat-card{min-height:150px;padding:18px 16px}.feat-card h2{font-size:27px}.feat-card .food{font-size:92px}.feat-card .food2{font-size:34px;right:70px}
 .grid{gap:10px}.cname{font-size:13.5px}
 .seg button{font-size:13px;padding:9px 4px}
 .statg{gap:6px}.statg b{font-size:21px}.statg span{font-size:10.5px}
 .rx b{font-size:28px}.rx{font-size:11.5px}
 .tlc .tt{width:100px}.tlc .tx{padding:13px}
 .hero{--fs:120px}.wm{font-size:58px}
 .li .t{font-size:14px}.thumb{width:52px;height:52px}
 .sec h2{font-size:20px}
}
@media (max-height:720px){
 h1.big{font-size:clamp(30px,9.5vw,38px);margin:2px 0 10px}
 h1.big br{display:none}
 .topbar{padding:0 0 4px}.mark{width:38px;height:38px}.tpill{padding:6px 12px 6px 7px;font-size:13px}
 .seg{margin-bottom:10px}
 .feat-card{min-height:0;padding:16px 16px 14px}.feat-card h2{font-size:25px;max-width:70%}.feat-card p{display:none}.feat-card .go{margin-top:10px;width:44px;height:44px}.feat-card .food{font-size:80px;bottom:-14px}.feat-card .food2{display:none}
}
@media (min-width:600px){.phone{max-width:480px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}}
/* ===== review round additions ===== */
:focus{outline:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:12px}
.ng button{transition:width .2s,background .2s}
.ng button .nl{display:none;font-size:13px;font-weight:700}
.ng button.on{width:auto;padding:0 16px 0 13px;gap:6px;border-radius:999px}
.ng button.on .nl{display:inline}
@media (max-width:360px){.ng button.on{padding:0 11px 0 9px}.ng button.on .nl{font-size:12px}.nav{gap:6px}.ng{padding:4px;gap:3px}.ng button{width:42px;height:42px}.fab{width:54px;height:54px}}
.pdrop{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:190px;border-radius:30px;border:2.5px dashed rgba(200,242,58,.55);background:radial-gradient(circle at 50% 30%,rgba(200,242,58,.12),transparent 70%),var(--bg2);text-align:center;padding:18px;color:var(--fg)}
.pdrop b{font-size:17px}
.pdi{width:64px;height:64px;border-radius:50%;background:var(--lime);color:#15110F;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.12),0 8px 18px rgba(170,230,40,.3);margin-bottom:4px}
.memcard{display:flex;gap:12px;align-items:center;width:100%;background:linear-gradient(135deg,#F4FFD0,#DDF7A0);color:#15110F;border-radius:28px;padding:10px 14px 10px 10px;margin-bottom:14px;text-align:left;--ink2:#5A6B2E;--ink3:#7A8A50}
.memcard .mt{width:84px;height:84px;border-radius:20px;overflow:hidden;flex:none;--fs:40px;transform:rotate(-4deg);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.memcard .mt>*{width:100%;height:100%}
.sharecard{background:radial-gradient(circle at 50% 0,#2B0808,#120303 75%);color:#F6F2EC;border-radius:28px;padding:16px;--fs:90px}
.sharecard .sct{aspect-ratio:4/3;border-radius:22px;overflow:hidden}
.sharecard .sct>*{width:100%;height:100%}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 2.2s ease-in forwards;animation-delay:var(--d)}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(540deg);opacity:.2}}
.popin{animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:scale(.85);opacity:.4}100%{transform:none;opacity:1}}
.mv{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center}
.li .mv{min-height:34px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.flo,.spk{animation:none!important}}
/* light theme */
.phone.light{--bg:#F3EEE5;--bg2:#FFFFFF;--fg:#15110F;--ink2:#6E655D;--ink3:#A39A90;--line:rgba(21,17,15,.12);--soft:rgba(21,17,15,.05);--fieldbg:#fff;--chipbd:#CFC6B8;--segbg:#E8E1D5;--invbg:#15110F;--invfg:#fff;--danger:#C62A1F;--pillbg:#E8E1D5;--pillfg:#4A433D;--paper:#FFFFFF;background:var(--bg)}
.phone.light .eyebrow{color:#5E7F00}
.phone.light .label .req{color:#C62A1F}
.phone.light .nav::before{background:linear-gradient(transparent,rgba(243,238,229,.95) 55%)}
.phone.light .card,.phone.light .li,.phone.light .post,.phone.light .box,.phone.light .tlc,.phone.light .feat-card,.phone.light .banner{box-shadow:0 2px 10px rgba(60,40,20,.08)}
.phone.light .ptile.add{border-color:rgba(21,17,15,.25)}
.phone.light .pdrop{border-color:rgba(94,127,0,.5)}
.phone.light .tpill .ic{border-color:rgba(21,17,15,.4)}
.phone.light .field:focus{border-color:#15110F}
.phone.light :focus-visible{outline-color:#5E7F00}
/* ===== Game layer ===== */
.lvl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px 12px 12px;border-radius:26px;margin:0 0 10px;color:#15110F;background:linear-gradient(160deg,#F4FFB8 0%,#D9FA5A 45%,#B6E82C 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(0,0,0,.1),0 10px 24px rgba(170,230,40,.18);transition:transform .12s}
.lvl:active{transform:scale(.98)}
.lvl.big{padding:16px;border-radius:30px;margin-bottom:12px}
.lvb{flex:none;width:58px;height:58px;border-radius:18px;background:#15110F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-5deg);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.lvl.big .lvb{width:70px;height:70px;border-radius:22px}
.lve{font-size:26px;line-height:1}.lvl.big .lve{font-size:32px}
.lvn{font-family:Silkscreen,monospace;font-size:10px;margin-top:3px;color:var(--lime)}
.lvt{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:20px;letter-spacing:-.02em}.lvl.big .lvt{font-size:24px}
.xpn{font-family:Silkscreen,monospace;font-size:10.5px;opacity:.75;white-space:nowrap}
.xpbar{height:12px;border-radius:99px;background:rgba(21,17,15,.14);margin:6px 0 5px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#15110F,#3A3330);position:relative;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.xpbar i::after{content:'';position:absolute;inset:2px 6px auto 6px;height:3px;border-radius:9px;background:rgba(255,255,255,.35)}
.lvm{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;opacity:.85}
.streak{font-weight:800;white-space:nowrap;font-size:12.5px;background:rgba(21,17,15,.1);padding:3px 9px;border-radius:99px}.lvm .xpn{opacity:1}.streak.risk{color:#B23A22}
.qstrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}.qstrip::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);text-align:left}
.qchip b{display:block;font-size:12.5px;white-space:nowrap}.qchip small{display:block;font-size:11px;color:var(--ink2);font-weight:600}
.qchip.done{background:rgba(43,203,107,.14);border-color:rgba(43,203,107,.5)}
.qr{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.qr>span{position:absolute;font-size:18px;font-weight:800}.qr.sm>span{font-size:13px}
.quest.done .qr>span,.qchip.done .qr>span{color:#2BCB6B}
.quests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quest{background:var(--paper);--fg:#15110F;color:#15110F;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px}
.quest .qt{font-weight:800;font-size:14.5px;margin-top:4px;line-height:1.15}.quest .qs{font-size:12px;color:#776E66;font-weight:600}
.quest.done{background:#DDF7B0}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.bgrid.six{grid-template-columns:repeat(6,1fr);gap:6px;margin:4px 0 8px}
.bdg{background:var(--bg2);border:1.5px dashed var(--chipbd);border-radius:22px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--fg);min-width:0}
.bdg .bi{font-size:30px;line-height:1;filter:grayscale(1);opacity:.35}
.bdg .bt{font-size:11.5px;font-weight:700;text-align:center;line-height:1.15;opacity:.6}
.bdg .bp{width:70%;height:5px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}.bdg .bp i{display:block;height:100%;background:var(--lime)}
.bdg.on{background:linear-gradient(180deg,#FFF6CC,#FFD84D);border:0;color:#15110F;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.1)}
.bdg.on .bi{filter:none;opacity:1;animation:wob 3s ease-in-out infinite}.bdg.on .bt{opacity:1}
.bgrid.six .bdg{padding:8px 2px;border-radius:16px}.bgrid.six .bi{font-size:22px}.bgrid.six .bt{display:none}
.bgrid.six .bdg.more{background:var(--bg2);border:1.5px solid var(--line)}.bgrid.six .more .bi{font-size:13px;font-weight:800;filter:none;opacity:1}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.modal .bdg{background:#ECE5DA}.modal .bdg.on{background:linear-gradient(180deg,#FFF6CC,#FFD84D)}
.wkrow{display:flex;justify-content:center;gap:6px;margin:2px 0 12px}
.wkrow span{width:30px;height:30px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px}
.wkrow span.on{background:#FFE7D6;border-color:#FF9A5C}.wkrow span.cur{outline:2px solid var(--lime);outline-offset:2px}
.pass{background:#F3E9D2;--fg:#15110F;color:#15110F;border-radius:var(--r);padding:16px;margin:12px 0;background-image:radial-gradient(rgba(21,17,15,.06) 1px,transparent 1px);background-size:10px 10px;box-shadow:inset 0 0 0 2px rgba(21,17,15,.08)}
.pass .label{color:#776E66}
.pnum{text-align:center;background:#15110F;color:#fff;border-radius:16px;padding:6px 12px;transform:rotate(4deg)}.pnum b{display:block;font-family:'Bricolage Grotesque';font-size:24px;line-height:1}.pnum small{font-family:Silkscreen,monospace;font-size:9px;color:var(--lime)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2.5px dashed rgba(21,17,15,.18);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;transform:rotate(var(--r))}
.stamp .sti{display:flex;flex-direction:column;align-items:center;gap:2px}
.stamp b{font-family:Silkscreen,monospace;font-size:10px;line-height:1.1;text-transform:uppercase;color:rgba(21,17,15,.3);word-break:break-word}
.stamp small{font-size:9.5px;color:rgba(21,17,15,.3);font-weight:600}
.stamp.on{border:3px double var(--c);box-shadow:inset 0 0 0 5px #F3E9D2,inset 0 0 0 7px var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.stamp.on b,.stamp.on small{color:var(--c)}
.league{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:#fff}
.lr.mine{background:var(--lime);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.lrk{width:26px;text-align:center;font-weight:800;font-size:18px}.lx{font-family:Silkscreen,monospace;font-size:11px}
.av.sm{width:34px;height:34px;border-radius:11px}
.xprules{display:grid;gap:4px;margin-top:8px}.xprules div{display:flex;justify-content:space-between;border-bottom:1px dashed #E4DCCF;padding:4px 0}.xprules b{font-family:Silkscreen,monospace;font-size:11px;color:#2F6B00}

function searchResults(){

 const spotOk=s=>(!q.cuisine||s.cuisine===q.cuisine)&&(!q.city||s.city===q.city);
 const dishOnly=q.react||q.fav;
 const ds=(q.scope==='all'||q.scope==='dishes')?S.dishes.filter(d=>{const s=spot(d.spotId),ex=expsOf(d.id);if(!spotOk(s))return false;if(q.react&&ex[0].reaction!==q.react)return false;if(q.fav&&!d.fav)return false;return has(d.name)||has(d.cat)||has(s.name)||has(s.area)||has(s.city)||has(s.cuisine)||ex.some(e=>has(e.note))}):[];
 const ss=(!dishOnly&&(q.scope==='all'||q.scope==='spots'))?allSpots().filter(s=>spotOk(s)&&(has(s.name)||has(s.area)||has(s.city)||has(s.cuisine))).sort((a,b)=>(spotStatus(b.id)?1:0)-(spotStatus(a.id)?1:0)).slice(0,12):[];
 const us=(!dishOnly&&!q.cuisine&&(q.scope==='all'||q.scope==='people'))?S.users.filter(u=>(!q.city||u.city===q.city)&&(has(u.name)||has(u.handle))):[];
 const sv=(!dishOnly&&(q.scope==='all'||q.scope==='saved'))?S.saved.filter(s=>{const sp=spot(s.spotId);return spotOk(sp)&&(has(s.name)||has(sp.name)||has(sp.area))}):[];
 const fp=(q.scope==='all'&&t&&!q.fav)?S.posts.filter(p=>canSee(p)&&user(p.userId).rel!=='none'&&(!q.react||p.reaction===q.react)&&spotOk(spot(p.spotId))&&(has(p.dish)||has(spot(p.spotId).name)||has(p.note))):[];
 if(!ds.length&&!ss.length&&!us.length&&!sv.length&&!fp.length)return `<div class="empty">${emptyArt(9)}<h2>No matches${t?' for “'+esc(q.q)+'”':''}</h2><p>Try a dish name, a food spot, an area or a city. Or clear a filter.</p></div>`;
 let h='';
 if(ds.length)h+=`<div class="sec"><h2>Your dishes</h2><span class="tiny muted">${ds.length}</span></div><div class="grid">${ds.map(d=>dishCard(d)).join('')}</div>`;
 if(ss.length)h+=`<div class="sec"><h2>Food spots</h2></div><div class="list">${ss.map(s=>{const st=spotStatus(s.id);return `<button class="li" data-a="openSpot" data-id="${s.id}"><div class="thumb"><div class="ph" style="--h:40"><span>📍</span></div></div><div class="grow"><div class="t ell">${esc(s.name)}</div><div class="s ell">${esc(s.cuisine)} · ${esc(s.area)}, ${esc(s.city)}</div></div>${st==='visited'?`<span class="pill grn">Visited</span>`:st==='saved'?`<span class="pill amb">Saved</span>`:`<span class="pill">New</span>`}</button>`}).join('')}</div>`;
 if(fp.length)h+=`<div class="sec"><h2>From people you follow</h2></div><div class="list">${fp.map(p=>{const u=user(p.userId);return `<button class="li" data-a="openUser" data-id="${u.id}"><div class="thumb">${photoHTML(p.photo,p.cat)}</div><div class="grow"><div class="t ell">${esc(p.dish)}</div><div class="s ell">${esc(u.name)} · ${esc(spot(p.spotId).name)}</div></div><span>${REACT[p.reaction].e}</span></button>`}).join('')}</div>`;
 if(sv.length)h+=`<div class="sec"><h2>Saved</h2></div><div class="list">${sv.map(s=>`<button class="li" data-a="openSpot" data-id="${s.spotId}"><div class="thumb">${s.type==='dish'?photoHTML(s.photo,s.cat):`<div class="ph" style="--h:40"><span>📍</span></div>`}</div><div class="grow"><div class="t ell">${esc(s.type==='dish'?s.name:spot(s.spotId).name)}</div><div class="s ell">${esc(spot(s.spotId).name)}</div></div>${s.status==='tried'?'<span class="pill grn">Tried</span>':'<span class="pill amb">Want to try</span>'}</button>`).join('')}</div>`;
 if(us.length)h+=`<div class="sec"><h2>People</h2></div><div class="list">${us.map(u=>`<div class="li">${avatar(u)}<button class="grow" data-a="openUser" data-id="${u.id}"><div class="t">${esc(u.name)}</div><div class="s">@${esc(u.handle)} · ${esc(u.city)}</div></button>${relBtn(u)}</div>`).join('')}</div>`;
 return h;
}

 const G={n:S.exps.length,cat:{},notes:0,photos:0,nope:0,per:{},withFr:0,tried:0};
 const ex=S.exps.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
 const sSpot=new Set,sCity=new Set,sCat=new Set,sCuis=new Set,re={},spV={};let xp=0;
 ex.forEach(e=>{const d=dish(e.dishId);if(!d)return;const sp=spot(d.spotId);const r=[['Logged a dish',10]];
  if(e.photos&&e.photos.length){r.push(['Photo',5]);G.photos+=e.photos.length}
  if(e.note){r.push(['Note',5]);G.notes++}
  if(!sSpot.has(sp.id)){sSpot.add(sp.id);r.push(['New spot',15])}
  if(sp.city&&!sCity.has(sp.city)){sCity.add(sp.city);r.push(['New city',40])}
  if(sp.cuisine&&!sCuis.has(sp.cuisine)){sCuis.add(sp.cuisine);r.push(['New cuisine',10])}
  if(d.cat&&!sCat.has(d.cat)){sCat.add(d.cat);r.push(['New category',10])}
  re[d.id]=(re[d.id]||0)+1;if(re[d.id]===3)r.push(['Regular',10]);
  if(d.cat)G.cat[d.cat]=(G.cat[d.cat]||0)+1;if(e.reaction==='nope')G.nope++;
  const x=r.reduce((a,b)=>a+b[1],0);G.per[e.id]={xp:x,r};xp+=x});
 S.visits.forEach(v=>{spV[v.spotId]=(spV[v.spotId]||0)+1;if(v.friends&&v.friends.length)G.withFr++});
 S.saved.forEach(s=>{xp+=2;if(s.status==='tried'){xp+=20;G.tried++}});xp+=S.collections.length*10;
 G.spots=sSpot.size;G.cities=sCity.size;G.cuis=sCuis.size;G.cityList=[...sCity];G.cuisList=[...sCuis];
 G.maxRe=Math.max(0,...Object.values(re));G.maxSpot=Math.max(0,...Object.values(spV));
 // weekly streak
 const wk=new Set(S.exps.map(e=>weekStart(e.date))),cur=weekStart(todayISO());
 let w=wk.has(cur)?cur:addDays(cur,-7),st=0;while(wk.has(w)){st++;w=addDays(w,-7)}
 G.streak=st;G.thisWeek=wk.has(cur);
 const sw=[...wk].sort();let best=0,run=0,prev='';sw.forEach(x=>{run=prev&&addDays(prev,7)===x?run+1:1;best=Math.max(best,run);prev=x});G.best=Math.max(best,st);
 G.weeks=Array.from({length:8},(_,i)=>{const k=addDays(cur,-7*(7-i));return{k,on:wk.has(k),cur:k===cur}});
 // quests (this week)
 const inW=e=>weekStart(e.date)===cur,wex=S.exps.filter(inW);
 const firstAt={};ex.forEach(e=>{const d=dish(e.dishId);if(d&&!firstAt[d.spotId])firstAt[d.spotId]=e.date});
 const newSp=Object.values(firstAt).filter(dt=>weekStart(dt)===cur).length;
 const trW=S.saved.filter(s=>s.status==='tried'&&s.triedOn&&weekStart(s.triedOn)===cur).length;
 G.quests=[['q1','🍽️','Log 3 dishes',wex.length,3],['q2','🧭','Try somewhere new',newSp,1],['q3','✅','Try something you saved',trW,1],['q4','✍️','Write 2 notes',wex.filter(e=>e.note).length,2]].map(([id,e,t,c,g])=>({id,e,t,c:Math.min(c,g),g,done:c>=g}));
 G.daysLeft=7-((new Date(todayISO()+'T12:00:00').getDay()+6)%7);
 xp+=G.quests.filter(q=>q.done).length*QXP;
 G.badges=BADGES.map(([id,e,t,d,f])=>{const[c,g]=f(G);return{id,e,t,d,c:Math.min(c,g),g,done:c>=g}});
 xp+=G.badges.filter(b=>b.done).length*BXP;
 G.weekXP=wex.reduce((a,e)=>a+(G.per[e.id]?G.per[e.id].xp:0),0)+G.quests.filter(q=>q.done).length*QXP;
 G.xp=xp;let li=0;LEVELS.forEach((l,i)=>{if(xp>=l[0])li=i});
 G.lv=li+1;G.lvName=LEVELS[li][1];G.lvE=LEVELS[li][2];G.lvMin=LEVELS[li][0];G.lvMax=LEVELS[li+1]?LEVELS[li+1][0]:null;
 G.pct=G.lvMax?Math.round((xp-G.lvMin)/(G.lvMax-G.lvMin)*100):100;
 return G;
}
const ring=(c,g,sz=44,col='var(--lime)')=>{const r=sz/2-4,C=2*Math.PI*r,p=g?Math.min(1,c/g):0;return `<svg class="ring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(127,127,127,.22)" stroke-width="5"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg>`};
function lvlCard(G,big){
 return `<button class="lvl ${big?'big':''}" data-a="openGame" data-v="badges" aria-label="Level ${G.lv} ${G.lvName}, ${G.xp} XP. ${G.streak}-week streak. Open progress">
  <div class="lvb"><span class="lve">${G.lvE}</span><span class="lvn">LV ${G.lv}</span></div>
  <div class="grow" style="min-width:0"><div class="row between" style="flex-wrap:nowrap"><b class="lvt ell">${G.lvName}</b><span class="streak ${G.thisWeek?'':'risk'}">🔥 ${G.streak} wk${G.streak===1?'':'s'}</span></div>
   <div class="xpbar"><i style="width:${G.pct}%"></i></div>
   <div class="lvm"><span class="xpn">${G.xp}${G.lvMax?' / '+G.lvMax:''} XP</span>${G.lvMax?`<span>${G.lvMax-G.xp} to ${LEVELS[G.lv][1]}</span>`:'<span>Max level!</span>'}</div></div></button>`;
}
function questsHTML(G,compact){

 return `<div class="sec" style="margin-top:${compact?16:8}px"><h2>This week's quests</h2><span class="tiny muted">${done}/${G.quests.length} · resets in ${G.daysLeft}d</span></div>
 <div class="quests ${compact?'scroll':''}">${G.quests.map(q=>`<div class="quest ${q.done?'done':''}"><div class="qr">${ring(q.c,q.g,48,q.done?'#2BCB6B':'var(--lime)')}<span>${q.done?'✓':q.e}</span></div><div class="qt">${q.t}</div><div class="qs">${q.done?'Done!':q.c+' / '+q.g} · +${QXP} XP</div></div>`).join('')}</div>`;

function badgeHTML(b){return `<button class="bdg ${b.done?'on':''}" data-a="badgeInfo" data-id="${b.id}" aria-label="${esc(b.t)}${b.done?', unlocked':', locked, '+b.c+' of '+b.g}"><div class="bi">${b.e}</div><div class="bt">${b.t}</div>${b.done?'':`<div class="bp"><i style="width:${Math.round(b.c/b.g*100)}%"></i></div>`}</button>`}
const STAMPC=['#FF4B4B','#3D6BFF','#1FA855','#FF8DC7','#FF6B2C','#8B5CF6','#C8A200'];
function stamp(label,sub,on,i){const c=STAMPC[i%STAMPC.length];return `<div class="stamp ${on?'on':''}" style="--c:${c};--r:${on?((i*37)%17-8):0}deg"><div class="sti"><b>${esc(label)}</b><small>${on?esc(sub):'Not yet'}</small></div></div>`}
function passportHTML(G){
 const firstCity={},firstCuis={};S.exps.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{const d=dish(e.dishId);if(!d)return;const sp=spot(d.spotId);if(sp.city&&!firstCity[sp.city])firstCity[sp.city]=e.date;if(sp.cuisine&&!firstCuis[sp.cuisine])firstCuis[sp.cuisine]=e.date});
 const cities=[...new Set([...Object.keys(firstCity),...CITYLIST])];
 const cuis=[...new Set([...Object.keys(firstCuis),...DIR.map(s=>s.cuisine)])];

  <div class="label" style="margin-top:12px">Cities · ${G.cities}/${cities.length}</div><div class="stamps">${cities.map((c,i)=>stamp(c,firstCity[c]?fmtShort(firstCity[c])+' '+firstCity[c].slice(2,4):'',!!firstCity[c],i)).join('')}</div>

 else b+=leagueHTML(G);
 return [head,b];

/* rewards: level-ups and badges, detected on any change */
function checkRewards(){
 if(!S.onboarded||window.DL_NO_REWARDS)return;const G=game(),have=G.badges.filter(b=>b.done).map(b=>b.id);
 if(!S.game){S.game={lv:G.lv,badges:have};save();return}
 const nb=have.filter(id=>!S.game.badges.includes(id)),up=G.lv>S.game.lv;
 if(!nb.length&&!up){if(G.lv<S.game.lv||have.length<S.game.badges.length){S.game={lv:G.lv,badges:have};save()}return}
 if(UI.modal||(UI.stack.length&&UI.stack[UI.stack.length-1].type==='log'))return; // wait for a calm moment
 S.game={lv:G.lv,badges:have};save();
 UI.modal={type:'reward',up:up?G.lv:0,badges:nb};render();celebrate(true);
}

function fuzzyHas(text,q){
 const T=String(text||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const words=T.split(/[^a-z0-9]+/).filter(Boolean);
 return q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/).filter(Boolean).every(tok=>{const alts=[tok,...(SYN[tok]||[])];return alts.some(a=>T.includes(a)||(a.length>=4&&words.some(w=>Math.abs(w.length-a.length)<=1&&lev(w,a)<=1)))});

document.addEventListener('input',ev=>{
 const el=ev.target,d=el.dataset;
 if(d.f){UI.form[d.f]=el.type==='checkbox'?el.checked:el.value;if(d.f==='ns_name'||d.f==='ns_city')UI.form.dup=null}
 if(d.lf){UI.log[d.lf]=el.value;if(d.lf==='name'&&UI.log.catAuto){const g=guessCat(el.value);if(g!==UI.log.cat){UI.log.cat=g;const c=$('#logCats');if(c)c.innerHTML=logCatsHTML()}}updateLogHint()}
 if(d.in==='spotQ'){UI.log.spotQ=el.value;const s=$('#spotSug');if(s)s.innerHTML=spotSugHTML()}
 if(d.in==='search'){UI.search.q=el.value;const r=$('#sres');if(r)r.innerHTML=searchResults()}
});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset;
 if(el.id==='file'){if(UI.log&&el.files.length)addFiles(el.files);el.value='';return}
 if(d.ld==='date'&&UI.log){if(el.value&&el.value<=todayISO())UI.log.date=el.value;render()}
 if(d.ch==='fSpot'){UI.fSpot=el.value;render()}
 if(d.ch==='bulkScope'){UI.form.scope=el.value;render()}
 if(d.ch==='svCity'){UI.svCity=el.value;render()}
 if(d.ch==='sCuisine'){UI.search.cuisine=el.value;render()}
 if(d.ch==='sCity'){UI.search.city=el.value;render()}
 if(d.f==='ns_city'){UI.form.dup=null;render()}
});
if(S.onboarded&&!S.notifs){S.notifs=seedNotifs();}
if(S.onboarded&&S.users)S.users.filter(u=>u.rel==='requested').forEach(u=>scheduleApproval(u.id));
render();
(()=>{let seen=false;try{seen=sessionStorage.getItem('dl-splash')}catch(e){}if(!seen){showSplash();try{sessionStorage.setItem('dl-splash','1')}catch(e){}}})();
</script>
</body>
</html>
